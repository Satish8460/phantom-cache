[package]
name = "phantom-cache-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }

[[test]]
name = "wp1_tests"
path = "tests/unit/wp1_tests.rs"

[[test]]
name = "wp2_tests"
path = "tests/unit/wp2_tests.rs"

[[test]]
name = "wp3_tests"
path = "tests/unit/wp3_tests.rs"

[[test]]
name = "wp4_tests"
path = "tests/unit/wp4_tests.rs"

