<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">PhantomCache technology stack by layer, with locked versions</title>
<desc id="d">Five horizontal layers from top to bottom: browser UI (React 18.3.1, Vite 5.4.21), HTTP ingress (Axum 0.7.9 on hyper 1.11.1 and Tokio 1.53.1, optional rustls TLS, tower-http CORS, jsonwebtoken), core engine (std Mutex shards, atomics, RwLock, eviction structures), outbound connections (hand-written HTTP/1.1 origin client, cluster mTLS with TLS 1.3 only and a custom binary frame protocol, ring SHA-256). A side column lists test and benchmark tools. Dashed boxes mark declared dependencies with no use found in src.</desc>
<rect width="900" height="600" fill="#ffffff"/>
<text x="450" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Technology stack by layer (versions are the Cargo.lock / node_modules values)</text>

<!-- Layer 1 UI -->
<rect x="20" y="44" width="640" height="92" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
<text x="34" y="66" font-size="15" font-weight="bold" fill="#111">1. Browser UI (ui/)</text>
<rect x="34" y="76" width="190" height="48" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="129" y="96" font-size="13" text-anchor="middle" fill="#111">React 18.3.1</text>
<text x="129" y="114" font-size="13" text-anchor="middle" fill="#111">hand-built SVG charts</text>
<rect x="234" y="76" width="190" height="48" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="329" y="96" font-size="13" text-anchor="middle" fill="#111">Vite 5.4.21 (build, dev)</text>
<text x="329" y="114" font-size="13" text-anchor="middle" fill="#111">plain CSS + tokens.css</text>
<rect x="434" y="76" width="212" height="48" fill="#ffffff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
<text x="540" y="96" font-size="13" text-anchor="middle" fill="#111">lucide-react: declared,</text>
<text x="540" y="114" font-size="13" text-anchor="middle" fill="#111">no import found</text>

<!-- arrow -->
<line x1="340" y1="136" x2="340" y2="160" stroke="#333" stroke-width="3"/>
<polygon points="331,158 349,158 340,170" fill="#333"/>
<text x="352" y="156" font-size="13" fill="#111">HTTP / SSE (fetch stream)</text>

<!-- Layer 2 ingress -->
<rect x="20" y="172" width="640" height="112" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
<text x="34" y="194" font-size="15" font-weight="bold" fill="#111">2. HTTP ingress (src/api/)</text>
<rect x="34" y="204" width="150" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="109" y="224" font-size="13" text-anchor="middle" fill="#111">Axum 0.7.9</text>
<text x="109" y="242" font-size="13" text-anchor="middle" fill="#111">on hyper 1.11.1</text>
<text x="109" y="260" font-size="13" text-anchor="middle" fill="#111">tower-http 0.5.2 CORS</text>
<rect x="194" y="204" width="150" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="269" y="224" font-size="13" text-anchor="middle" fill="#111">Tokio 1.53.1</text>
<text x="269" y="242" font-size="13" text-anchor="middle" fill="#111">multi-thread runtime</text>
<text x="269" y="260" font-size="13" text-anchor="middle" fill="#111">(main.rs)</text>
<rect x="354" y="204" width="150" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="429" y="224" font-size="13" text-anchor="middle" fill="#111">axum-server 0.7.3</text>
<text x="429" y="242" font-size="13" text-anchor="middle" fill="#111">+ rustls 0.23.46</text>
<text x="429" y="260" font-size="13" text-anchor="middle" fill="#111">(TLS only if configured)</text>
<rect x="514" y="204" width="132" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="580" y="224" font-size="13" text-anchor="middle" fill="#111">jsonwebtoken 9.3.1</text>
<text x="580" y="242" font-size="13" text-anchor="middle" fill="#111">HS256 only</text>
<text x="580" y="260" font-size="13" text-anchor="middle" fill="#111">serde / serde_json</text>

<line x1="340" y1="284" x2="340" y2="308" stroke="#333" stroke-width="3"/>
<polygon points="331,306 349,306 340,318" fill="#333"/>
<text x="352" y="304" font-size="13" fill="#111">function calls (same process)</text>

<!-- Layer 3 core -->
<rect x="20" y="320" width="640" height="112" fill="#d0d0d0" stroke="#111" stroke-width="2"/>
<text x="34" y="342" font-size="15" font-weight="bold" fill="#111">3. Core engine (src/core/, src/intel/): no async runtime types inside the locks</text>
<rect x="34" y="352" width="190" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="129" y="372" font-size="13" text-anchor="middle" fill="#111">std::sync::Mutex x 8 shards</text>
<text x="129" y="390" font-size="13" text-anchor="middle" fill="#111">HashMap + eviction arena</text>
<text x="129" y="408" font-size="13" text-anchor="middle" fill="#111">(Vec / VecDeque)</text>
<rect x="234" y="352" width="190" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="329" y="372" font-size="13" text-anchor="middle" fill="#111">std atomics (counters, caps)</text>
<text x="329" y="390" font-size="13" text-anchor="middle" fill="#111">RwLock epoch snapshot</text>
<text x="329" y="408" font-size="13" text-anchor="middle" fill="#111">log-linear histogram</text>
<rect x="434" y="352" width="212" height="68" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="540" y="372" font-size="13" text-anchor="middle" fill="#111">tokio::sync::oneshot</text>
<text x="540" y="390" font-size="13" text-anchor="middle" fill="#111">(waiters get the result)</text>
<text x="540" y="408" font-size="13" text-anchor="middle" fill="#111">watch (sweeper stop)</text>

<line x1="340" y1="432" x2="340" y2="456" stroke="#333" stroke-width="3"/>
<polygon points="331,454 349,454 340,466" fill="#333"/>
<text x="352" y="452" font-size="13" fill="#111">sockets</text>

<!-- Layer 4 outbound -->
<rect x="20" y="468" width="640" height="116" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
<text x="34" y="490" font-size="15" font-weight="bold" fill="#111">4. Outbound connections (src/api/server.rs, src/dist/, src/security/)</text>
<rect x="34" y="500" width="190" height="72" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="129" y="520" font-size="13" text-anchor="middle" fill="#111">Origin client: hand-written</text>
<text x="129" y="538" font-size="13" text-anchor="middle" fill="#111">HTTP/1.1 on tokio TcpStream</text>
<text x="129" y="556" font-size="13" text-anchor="middle" fill="#111">+ tokio-rustls 0.26.6</text>
<rect x="234" y="500" width="190" height="72" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="329" y="520" font-size="13" text-anchor="middle" fill="#111">Cluster: mTLS, TLS 1.3 only</text>
<text x="329" y="538" font-size="13" text-anchor="middle" fill="#111">custom 28-byte-header frames</text>
<text x="329" y="556" font-size="13" text-anchor="middle" fill="#111">(no serde on the wire)</text>
<rect x="434" y="500" width="212" height="72" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="540" y="520" font-size="13" text-anchor="middle" fill="#111">ring 0.17.14: SHA-256</text>
<text x="540" y="538" font-size="13" text-anchor="middle" fill="#111">(cert fingerprint, ring digest,</text>
<text x="540" y="556" font-size="13" text-anchor="middle" fill="#111">lab freeze hashes)</text>

<!-- side column -->
<rect x="680" y="44" width="200" height="540" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="780" y="66" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Verification tools</text>
<text x="692" y="92" font-size="13" fill="#111">Rust (dev-dependencies)</text>
<text x="692" y="112" font-size="13" fill="#111">cargo test (tests/)</text>
<text x="692" y="130" font-size="13" fill="#111">proptest 1.12.0</text>
<text x="692" y="148" font-size="13" fill="#111">reqwest 0.12.28</text>
<text x="692" y="166" font-size="13" fill="#111">rcgen 0.13.2 (test certs)</text>
<text x="692" y="184" font-size="13" fill="#111">hdrhistogram 7.6.0</text>
<text x="692" y="202" font-size="13" fill="#111">benches/ (custom main)</text>
<rect x="690" y="212" width="180" height="40" fill="#ffffff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
<text x="780" y="229" font-size="13" text-anchor="middle" fill="#111">criterion 0.5.1: declared,</text>
<text x="780" y="245" font-size="13" text-anchor="middle" fill="#111">no use found</text>
<text x="692" y="284" font-size="13" fill="#111">UI (Node 24 locally)</text>
<text x="692" y="304" font-size="13" fill="#111">node --test ui/test</text>
<text x="692" y="322" font-size="13" fill="#111">check-contrast, a11y lint</text>
<text x="692" y="340" font-size="13" fill="#111">axe-core 4.14.0 (dev)</text>
<text x="692" y="358" font-size="13" fill="#111">CDP scripts, own Chrome</text>
<text x="692" y="390" font-size="13" fill="#111">CI file (never seen run):</text>
<text x="692" y="408" font-size="13" fill="#111">.github/workflows/ci.yml</text>
<rect x="690" y="440" width="180" height="56" fill="#ffffff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
<text x="780" y="460" font-size="13" text-anchor="middle" fill="#111">tracing, tracing-subscriber:</text>
<text x="780" y="476" font-size="13" text-anchor="middle" fill="#111">declared, no use in src;</text>
<text x="780" y="492" font-size="13" text-anchor="middle" fill="#111">logs are println!</text>
<text x="692" y="524" font-size="13" fill="#111">Dashed box = declared but</text>
<text x="692" y="542" font-size="13" fill="#111">no use found by grep.</text>
<text x="692" y="560" font-size="13" fill="#111">No Dockerfile exists.</text>
</svg>
