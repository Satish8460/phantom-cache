<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 968" width="900" height="968" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
  <title id="t2">Request path with protection points marked</title>
  <desc id="d2">A cache GET request in secure mode from TCP accept to the stored result. Numbered steps 1 to 14 show each protection point in order. Solid boxes are implemented checks. A box with a double border and the word OPEN marks a check that the register lists as missing or incomplete.</desc>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
  </defs>
  <rect width="900" height="968" fill="#ffffff"/>
<text x="450" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Figure 6.2 GET /api/v1/cache/*key with each protection point (secure mode)</text>
<text x="175" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">INGRESS (before any cache work)</text>
<text x="645" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">CACHE CORE AND ORIGIN PATH</text>
<rect x="30" y="62" width="290" height="52" fill="#ffffff" stroke="#111" stroke-width="3"/><rect x="34" y="66" width="282" height="44" fill="#ffffff" stroke="#111" stroke-width="1"/><circle cx="30" cy="62" r="14" fill="#111"/><text x="30" y="67" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="175" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">TCP accept (OPEN)</text><text x="175" y="100" font-size="14" text-anchor="middle" fill="#111">no connection cap or timeout: G4B-01</text>
<rect x="30" y="132" width="290" height="52" fill="#dddddd" stroke="#111"/><circle cx="30" cy="132" r="14" fill="#111"/><text x="30" y="137" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="175" y="153" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">CORS allowlist layer</text><text x="175" y="170" font-size="14" text-anchor="middle" fill="#111">exact origins; never credentials</text>
<rect x="30" y="202" width="290" height="52" fill="#ffffff" stroke="#111" stroke-width="3"/><rect x="34" y="206" width="282" height="44" fill="#ffffff" stroke="#111" stroke-width="1"/><circle cx="30" cy="202" r="14" fill="#111"/><text x="30" y="207" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="175" y="223" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Body read, 512 KiB cap (OPEN)</text><text x="175" y="240" font-size="14" text-anchor="middle" fill="#111">extractor in handler; BEFORE auth</text>
<rect x="30" y="272" width="290" height="66" fill="#dddddd" stroke="#111"/><circle cx="30" cy="272" r="14" fill="#111"/><text x="30" y="277" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="175" y="293" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">authenticate_request</text><text x="175" y="310" font-size="14" text-anchor="middle" fill="#111">HS256 only; iss, aud, exp; kid</text><text x="175" y="327" font-size="14" text-anchor="middle" fill="#111">role cache:read; 401 or 403</text>
<rect x="30" y="356" width="290" height="66" fill="#dddddd" stroke="#111"/><circle cx="30" cy="356" r="14" fill="#111"/><text x="30" y="361" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="175" y="377" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">require_tenant_claim</text><text x="175" y="394" font-size="14" text-anchor="middle" fill="#111">tenant from token only; empty or</text><text x="175" y="411" font-size="14" text-anchor="middle" fill="#111">__default__ refused (403)</text>
<rect x="30" y="440" width="290" height="66" fill="#dddddd" stroke="#111"/><circle cx="30" cy="440" r="14" fill="#111"/><text x="30" y="445" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="175" y="461" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">CacheKey::validate</text><text x="175" y="478" font-size="14" text-anchor="middle" fill="#111">tenant alphabet, length caps, no</text><text x="175" y="495" font-size="14" text-anchor="middle" fill="#111">control bytes, dots, ":?" in path</text>
<rect x="30" y="524" width="290" height="66" fill="#dddddd" stroke="#111"/><circle cx="30" cy="524" r="14" fill="#111"/><text x="30" y="529" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">7</text><text x="175" y="545" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Bypass decision</text><text x="175" y="562" font-size="14" text-anchor="middle" fill="#111">x-cache-bypass or forwarded auth</text><text x="175" y="579" font-size="14" text-anchor="middle" fill="#111">skips the cache, still steps 10-12</text>
<rect x="410" y="62" width="470" height="66" fill="#dddddd" stroke="#111"/><circle cx="410" cy="62" r="14" fill="#111"/><text x="410" y="67" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">8</text><text x="645" y="83" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Shard lookup + epoch check</text><text x="645" y="100" font-size="14" text-anchor="middle" fill="#111">entry valid only if tenant and global epoch match; stale cap</text><text x="645" y="117" font-size="14" text-anchor="middle" fill="#111">enforced in the execution layer. HIT: respond here.</text>
<rect x="410" y="146" width="470" height="52" fill="#dddddd" stroke="#111"/><circle cx="410" cy="146" r="14" fill="#111"/><text x="410" y="151" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">9</text><text x="645" y="167" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Single-flight coalescing</text><text x="645" y="184" font-size="14" text-anchor="middle" fill="#111">one origin fetch per key; waiters share it (bounded)</text>
<rect x="410" y="216" width="470" height="66" fill="#ffffff" stroke="#111" stroke-width="3"/><rect x="414" y="220" width="462" height="58" fill="#ffffff" stroke="#111" stroke-width="1"/><circle cx="410" cy="216" r="14" fill="#111"/><text x="410" y="221" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">10</text><text x="645" y="237" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Origin permit (OPEN by default)</text><text x="645" y="254" font-size="14" text-anchor="middle" fill="#111">needs PHANTOM_ORIGIN_CAP_MAX and canary/active mode;</text><text x="645" y="271" font-size="14" text-anchor="middle" fill="#111">distinct keys are not limited: G4B-11</text>
<rect x="410" y="300" width="470" height="66" fill="#dddddd" stroke="#111"/><circle cx="410" cy="300" r="14" fill="#111"/><text x="410" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">11</text><text x="645" y="321" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">UpstreamPolicy + resolve_and_pin_origin</text><text x="645" y="338" font-size="14" text-anchor="middle" fill="#111">scheme, port, allowlist; every resolved IP filtered; connect to</text><text x="645" y="355" font-size="14" text-anchor="middle" fill="#111">the one validated address (gaps in IP ranges: G4B-15)</text>
<rect x="410" y="384" width="470" height="83" fill="#dddddd" stroke="#111"/><circle cx="410" cy="384" r="14" fill="#111"/><text x="410" y="389" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">12</text><text x="645" y="405" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">fetch_origin_raw + parse_http_response</text><text x="645" y="422" font-size="14" text-anchor="middle" fill="#111">request line re-encoded; only gateway-chosen headers sent;</text><text x="645" y="439" font-size="14" text-anchor="middle" fill="#111">5 s connect, 5 s handshake, 5 s read; 2 MiB body, 64 KiB headers;</text><text x="645" y="456" font-size="14" text-anchor="middle" fill="#111">conflicting length, bad chunking rejected; no redirects</text>
<rect x="410" y="485" width="470" height="83" fill="#dddddd" stroke="#111"/><circle cx="410" cy="485" r="14" fill="#111"/><text x="410" y="490" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">13</text><text x="645" y="506" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">finalize_fetch (fencing)</text><text x="645" y="523" font-size="14" text-anchor="middle" fill="#111">store only if generation and epochs still match. Open: the epochs</text><text x="645" y="540" font-size="14" text-anchor="middle" fill="#111">are re-read after the check (G4A-01, under investigation; a</text><text x="645" y="557" font-size="14" text-anchor="middle" fill="#111">sandbox proposal exists, not applied)</text>
<rect x="410" y="586" width="470" height="52" fill="#dddddd" stroke="#111"/><circle cx="410" cy="586" r="14" fill="#111"/><text x="410" y="591" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">14</text><text x="645" y="607" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Byte budget + eviction</text><text x="645" y="624" font-size="14" text-anchor="middle" fill="#111">entry rejected if over budget; oversize bodies never stored</text>
<line x1="175" y1="114" x2="175" y2="132" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175" y1="184" x2="175" y2="202" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175" y1="254" x2="175" y2="272" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175" y1="338" x2="175" y2="356" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175" y1="422" x2="175" y2="440" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="175" y1="506" x2="175" y2="524" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="128" x2="645" y2="146" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="198" x2="645" y2="216" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="282" x2="645" y2="300" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="366" x2="645" y2="384" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="467" x2="645" y2="485" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="645" y1="568" x2="645" y2="586" stroke="#222" stroke-width="2" marker-end="url(#ar2)"/>
<line x1="320" y1="473" x2="408" y2="95" stroke="#222" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar2)"/>
<text x="356" y="284" font-size="13" fill="#111" transform="rotate(-76.6 356 284)" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">normal path</text>
<line x1="320" y1="557" x2="408" y2="333" stroke="#222" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#ar2)"/>
<text x="362" y="459" font-size="13" fill="#111" transform="rotate(-68.1 362 459)" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">bypass</text>
<rect x="30" y="660" width="850" height="112" fill="#ffffff" stroke="#111" stroke-dasharray="5,3"/>
<text x="40" y="682" font-size="14" font-weight="bold" fill="#111">Rejections (no side effects at 4 to 6)</text>
<text x="40" y="704" font-size="14" fill="#111">401 bad or missing token</text>
<text x="40" y="721" font-size="14" fill="#111">403 role or tenant</text>
<text x="40" y="738" font-size="14" fill="#111">400 invalid key</text>
<text x="290" y="704" font-size="14" fill="#111">413 body over 512 KiB</text>
<text x="290" y="721" font-size="14" fill="#111">503 origin cap full</text>
<text x="290" y="738" font-size="14" fill="#111">502/504 origin error,</text>
<text x="290" y="755" font-size="14" fill="#111">timeout or bad framing</text>
<text x="560" y="704" font-size="14" fill="#111">Tested by: m7_sec_fixes,</text>
<text x="560" y="721" font-size="14" fill="#111">m7_sec_round2/3,</text>
<text x="560" y="738" font-size="14" fill="#111">security_phase2_upstream,</text>
<text x="560" y="755" font-size="14" fill="#111">parser_robustness, origin_cap</text>
<rect x="30" y="788" width="850" height="168" fill="#ffffff" stroke="#111"/>
<text x="40" y="808" font-size="14" font-weight="bold" fill="#111">How to read it</text>
<text x="40" y="828" font-size="13" fill="#111">Shaded box = check implemented and exercised by a named test.</text>
<text x="40" y="845" font-size="13" fill="#111">Double-bordered box = check that is absent or incomplete today (see the matrix).</text>
<text x="40" y="862" font-size="13" fill="#111">In the GET handler the order is: body extractor (step 3), then authentication (4), tenant (5), key validation (6).</text>
<text x="40" y="879" font-size="13" fill="#111">This is the G4B-01 ordering gap.</text>
<text x="40" y="896" font-size="13" fill="#111">DELETE follows steps 1-6 with cache:invalidate, then purges locally and calls the router (Figure 6.3). Peer frames never use this path.</text>
<text x="40" y="913" font-size="13" fill="#111">Source: src/api/server.rs get_cache_handler, authenticate_request, require_tenant_claim, fetch_origin_raw;</text>
<text x="40" y="930" font-size="13" fill="#111">src/core/cache.rs CacheKey::validate, finalize_fetch; src/security/upstream.rs.</text>
<text x="40" y="947" font-size="13" fill="#111">Verified by reading the code at the time of writing; no request was traced at run time.</text>
</svg>
