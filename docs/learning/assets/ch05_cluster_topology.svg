<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Arial, Helvetica, sans-serif">
  <title>PhantomCache cluster topology (mTLS full mesh, static membership)</title>
  <desc>Three gateways, each with an HTTP ingress, a local serving cache that is shared with its cluster node, a router with connection pool and repair ledger, and an mTLS cluster listener. Gateways are connected by a full mesh of mutually authenticated TLS 1.3 links. Membership comes from a static file loaded at startup. GET requests are answered from the local cache and the origin only; the mesh carries invalidations, anti-entropy and heartbeats.</desc>
  <rect x="0" y="0" width="900" height="630" fill="#ffffff"/>
  <!-- membership file + CA -->
  <rect x="20" y="14" width="440" height="58" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <text x="240" y="36" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">PHANTOM_CLUSTER_MEMBERS_FILE (static)</text>
  <text x="240" y="56" font-size="14" text-anchor="middle" fill="#111">node ids, active flag, cert fingerprints, version = membership epoch</text>
  <rect x="480" y="14" width="400" height="58" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
  <text x="680" y="36" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Cluster CA (PHANTOM_CLUSTER_CA)</text>
  <text x="680" y="56" font-size="14" text-anchor="middle" fill="#111">only trust root for peer links; WebPKI excluded</text>
  <text x="450" y="92" font-size="14" text-anchor="middle" fill="#111">Both are read once at startup. A change needs a process restart (no production reload path).</text>

  <!-- gateways -->
  <g id="g1">
    <rect x="20" y="110" width="270" height="290" fill="#f4f4f4" stroke="#111" stroke-width="2.5"/>
    <text x="155" y="132" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Gateway 1 (one OS process)</text>
    <rect x="34" y="144" width="242" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="155" y="161" font-size="14" text-anchor="middle" fill="#111">HTTP ingress (axum)</text>
    <text x="155" y="177" font-size="14" text-anchor="middle" fill="#111">GET: local only | DELETE: cluster</text>
    <rect x="34" y="192" width="242" height="40" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
    <text x="155" y="209" font-size="14" text-anchor="middle" fill="#111">PartitionedCache (serving cache)</text>
    <text x="155" y="225" font-size="14" text-anchor="middle" fill="#111">shared with the local cluster node</text>
    <rect x="34" y="240" width="242" height="78" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="155" y="258" font-size="14" text-anchor="middle" fill="#111">RendezvousRouter</text>
    <text x="155" y="275" font-size="14" text-anchor="middle" fill="#111">pool + broadcaster + RepairLedger</text>
    <text x="155" y="292" font-size="14" text-anchor="middle" fill="#111">anti-entropy + pre-warm workers</text>
    <text x="155" y="309" font-size="14" text-anchor="middle" fill="#111">ledger and ring: memory only</text>
    <rect x="34" y="326" width="242" height="60" fill="#444" stroke="#111" stroke-width="1.5"/>
    <text x="155" y="347" font-size="14" text-anchor="middle" fill="#fff">cluster listener (mTLS)</text>
    <text x="155" y="364" font-size="14" text-anchor="middle" fill="#fff">64 handshake permits, 1 s timeout</text>
    <text x="155" y="380" font-size="14" text-anchor="middle" fill="#fff">peers: address-only descriptors</text>
  </g>
  <g id="g2">
    <rect x="315" y="110" width="270" height="290" fill="#f4f4f4" stroke="#111" stroke-width="2.5"/>
    <text x="450" y="132" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Gateway 2</text>
    <rect x="329" y="144" width="242" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="161" font-size="14" text-anchor="middle" fill="#111">HTTP ingress (axum)</text>
    <text x="450" y="177" font-size="14" text-anchor="middle" fill="#111">GET: local only | DELETE: cluster</text>
    <rect x="329" y="192" width="242" height="40" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="209" font-size="14" text-anchor="middle" fill="#111">PartitionedCache (serving cache)</text>
    <text x="450" y="225" font-size="14" text-anchor="middle" fill="#111">shared with the local cluster node</text>
    <rect x="329" y="240" width="242" height="78" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="258" font-size="14" text-anchor="middle" fill="#111">RendezvousRouter</text>
    <text x="450" y="275" font-size="14" text-anchor="middle" fill="#111">pool + broadcaster + RepairLedger</text>
    <text x="450" y="292" font-size="14" text-anchor="middle" fill="#111">anti-entropy + pre-warm workers</text>
    <text x="450" y="309" font-size="14" text-anchor="middle" fill="#111">ledger and ring: memory only</text>
    <rect x="329" y="326" width="242" height="60" fill="#444" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="347" font-size="14" text-anchor="middle" fill="#fff">cluster listener (mTLS)</text>
    <text x="450" y="364" font-size="14" text-anchor="middle" fill="#fff">64 handshake permits, 1 s timeout</text>
    <text x="450" y="380" font-size="14" text-anchor="middle" fill="#fff">peers: address-only descriptors</text>
  </g>
  <g id="g3">
    <rect x="610" y="110" width="270" height="290" fill="#f4f4f4" stroke="#111" stroke-width="2.5"/>
    <text x="745" y="132" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Gateway 3</text>
    <rect x="624" y="144" width="242" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="745" y="161" font-size="14" text-anchor="middle" fill="#111">HTTP ingress (axum)</text>
    <text x="745" y="177" font-size="14" text-anchor="middle" fill="#111">GET: local only | DELETE: cluster</text>
    <rect x="624" y="192" width="242" height="40" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
    <text x="745" y="209" font-size="14" text-anchor="middle" fill="#111">PartitionedCache (serving cache)</text>
    <text x="745" y="225" font-size="14" text-anchor="middle" fill="#111">shared with the local cluster node</text>
    <rect x="624" y="240" width="242" height="78" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="745" y="258" font-size="14" text-anchor="middle" fill="#111">RendezvousRouter</text>
    <text x="745" y="275" font-size="14" text-anchor="middle" fill="#111">pool + broadcaster + RepairLedger</text>
    <text x="745" y="292" font-size="14" text-anchor="middle" fill="#111">anti-entropy + pre-warm workers</text>
    <text x="745" y="309" font-size="14" text-anchor="middle" fill="#111">ledger and ring: memory only</text>
    <rect x="624" y="326" width="242" height="60" fill="#444" stroke="#111" stroke-width="1.5"/>
    <text x="745" y="347" font-size="14" text-anchor="middle" fill="#fff">cluster listener (mTLS)</text>
    <text x="745" y="364" font-size="14" text-anchor="middle" fill="#fff">64 handshake permits, 1 s timeout</text>
    <text x="745" y="380" font-size="14" text-anchor="middle" fill="#fff">peers: address-only descriptors</text>
  </g>

  <!-- mesh -->
  <path d="M 290 356 L 329 356" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M 585 356 L 624 356" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M 155 400 L 155 430 L 745 430 L 745 400" stroke="#111" stroke-width="4" fill="none"/>
  <text x="450" y="450" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">full mesh of mTLS TLS 1.3 links (1-2, 2-3, 1-3), pooled, up to 8 per peer</text>
  <text x="450" y="470" font-size="14" text-anchor="middle" fill="#111">frames carried: InvalidateRequest/Ack, AntiEntropySync, Heartbeat.</text>
  <text x="450" y="488" font-size="14" text-anchor="middle" fill="#111">GetRequest exists but no production code sends it.</text>

  <!-- origin and clients -->
  <rect x="40" y="496" width="190" height="50" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="135" y="518" font-size="14" text-anchor="middle" fill="#111">Clients (HTTP, JWT)</text>
  <text x="135" y="535" font-size="14" text-anchor="middle" fill="#111">any gateway</text>
  <rect x="670" y="496" width="190" height="50" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="765" y="518" font-size="14" text-anchor="middle" fill="#111">Origin (HTTP)</text>
  <text x="765" y="535" font-size="14" text-anchor="middle" fill="#111">each gateway fetches itself</text>
  <path d="M 135 496 L 135 400" stroke="#111" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
  <text x="262" y="516" font-size="14" fill="#111">GET: answered by the gateway the client</text>
  <text x="262" y="533" font-size="14" fill="#111">reached; a miss goes straight to the origin.</text>
  <text x="262" y="550" font-size="14" fill="#111">No read is routed to a "primary" node.</text>
  <path d="M 765 496 L 765 400" stroke="#111" stroke-width="2" fill="none"/>
  <text x="450" y="588" font-size="14" text-anchor="middle" fill="#111">Legend: grey = serving cache; dark = cluster listener; dashed = traffic that never uses the mesh.</text>
  <text x="450" y="606" font-size="14" text-anchor="middle" fill="#111">Three demo nodes with separate caches exist only without cluster TLS (see text, section 5.2).</text>
</svg>
