<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-labelledby="t1 d1">
  <title id="t1">Shard and lock structure of PartitionedCache</title>
  <desc id="d1">A cache key is hashed and masked to pick one of eight shards. Each shard is a mutex around a CacheShard holding the key map, the in-flight map, byte counters and an eviction policy. Epoch state is global, outside the shard mutexes, and is only read while a shard lock is held.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #111; }
    .s { font-size: 14px; }
    .b { font-weight: bold; }
    .box { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .shard { fill: #e6e6e6; stroke: #111; stroke-width: 1.5; }
    .hot { fill: #bdbdbd; stroke: #111; stroke-width: 2.5; }
    .glob { fill: #f5f5f5; stroke: #111; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .arr { stroke: #111; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .arr2 { stroke: #111; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="570" fill="#fff"/>
  <text x="20" y="26" class="b" style="font-size:16px">Figure 4.1: Shards, mutexes and where global state lives</text>

  <rect class="box" x="20" y="44" width="250" height="56"/>
  <text x="30" y="66" class="b">CacheKey</text>
  <text x="30" y="86" class="s">tenant_id, path, query</text>
  <path class="arr" d="M270,72 L318,72"/>
  <rect class="box" x="320" y="44" width="560" height="56"/>
  <text x="330" y="66" class="b">get_shard_index</text>
  <text x="330" y="86" class="s">DefaultHasher over the whole key, then hash AND shard_mask (7 for 8 shards)</text>

  <path class="arr" d="M600,100 L600,128"/>
  <text x="610" y="120" class="s">index 0..7</text>

  <g>
    <rect class="shard" x="20"  y="130" width="95" height="44"/><text x="45" y="158">shard 0</text>
    <rect class="shard" x="125" y="130" width="95" height="44"/><text x="150" y="158">shard 1</text>
    <rect class="shard" x="230" y="130" width="95" height="44"/><text x="255" y="158">shard 2</text>
    <rect class="shard" x="335" y="130" width="95" height="44"/><text x="360" y="158">shard 3</text>
    <rect class="shard" x="440" y="130" width="95" height="44"/><text x="465" y="158">shard 4</text>
    <rect class="hot"   x="545" y="130" width="95" height="44"/><text x="570" y="158" class="b">shard 5</text>
    <rect class="shard" x="650" y="130" width="95" height="44"/><text x="675" y="158">shard 6</text>
    <rect class="shard" x="755" y="130" width="95" height="44"/><text x="780" y="158">shard 7</text>
  </g>
  <text x="20" y="192" class="s">One std::sync::Mutex per shard; main.rs builds 8 shards.</text>
  <text x="20" y="207" class="s">Keys on different shards never wait for each other.</text>

  <path class="arr" d="M592,174 L592,214"/>
  <rect class="box" x="20" y="214" width="560" height="236"/>
  <text x="30" y="236" class="b">Inside one locked CacheShard (shard 5 shown)</text>
  <rect class="box" x="34" y="248" width="532" height="40"/>
  <text x="44" y="266" class="b s">map: HashMap&lt;CacheKey, KeyState&gt;</text>
  <text x="44" y="282" class="s">KeyState: generation, instance id, active ops, entry, freshness, epochs</text>
  <rect class="box" x="34" y="296" width="532" height="40"/>
  <text x="44" y="314" class="b s">in_flight: HashMap&lt;CacheKey, Arc&lt;SharedOp&gt;&gt;</text>
  <text x="44" y="330" class="s">one SharedOp per key being fetched: op_id, op_gen, waiters list</text>
  <rect class="box" x="34" y="344" width="532" height="40"/>
  <text x="44" y="362" class="b s">bytes, byte_budget</text>
  <text x="44" y="378" class="s">logical bytes of this shard only; budget = total / shard count</text>
  <rect class="box" x="34" y="392" width="532" height="48"/>
  <text x="44" y="410" class="b s">eviction: Box&lt;dyn ShardEvictionPolicy&gt;</text>
  <text x="44" y="428" class="s">FaithfulSieve (default), FaithfulLru or FaithfulS3Fifo; one instance per shard</text>

  <rect class="glob" x="610" y="214" width="270" height="236"/>
  <text x="620" y="236" class="b">Global, outside every shard</text>
  <text x="620" y="260" class="s">tenant_epochs: Mutex&lt;HashMap&gt;</text>
  <text x="620" y="278" class="s">  written only by invalidate_*</text>
  <text x="620" y="302" class="s">epoch_snapshot:</text>
  <text x="620" y="320" class="s">  RwLock&lt;Arc&lt;HashMap&gt;&gt;</text>
  <text x="620" y="338" class="s">  read by every request path</text>
  <text x="620" y="362" class="s">global_epoch: AtomicU64</text>
  <text x="620" y="386" class="s">counters: atomics</text>
  <text x="620" y="410" class="s">next_op_id, next_instance_id:</text>
  <text x="620" y="428" class="s">  AtomicU64</text>

  <path class="arr2" d="M580,320 L608,320"/>

  <rect class="box" x="20" y="466" width="860" height="94"/>
  <text x="30" y="486" class="b">Lock edges that exist in the code (read from cache.rs)</text>
  <text x="30" y="506" class="s">Shard mutex, then epoch_snapshot read lock (inside get_effective_epochs), released at once.</text>
  <text x="30" y="524" class="s">Shard mutex, then SharedOp.waiters or pending_freshness; shard mutex, then the eviction_policy mutex.</text>
  <text x="30" y="542" class="s">tenant_epochs mutex, then epoch_snapshot write lock (try_invalidate_*). No code nests tenant_epochs with a shard.</text>
</svg>
