<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Origin load for 100 simultaneous requests: no cache, cache without single-flight, cache with single-flight</title>
<desc id="d">Three columns. With no cache, 100 requests cause 100 origin fetches. With a cache but no single-flight, 100 requests that arrive while the entry is missing still cause 100 origin fetches. With single-flight coalescing, 100 requests cause 1 origin fetch and 99 waiters share the result.</desc>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Same moment, 100 clients ask for the same key</text>
<rect x="20" y="50" width="270" height="390" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
<text x="155" y="76" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">A. No cache</text>
<rect x="45" y="95" width="220" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="155" y="120" font-size="14" text-anchor="middle" fill="#111">100 client requests</text><line x1="155" y1="135" x2="155" y2="222" stroke="#333" stroke-width="3"/><polygon points="145,220 165,220 155,238" fill="#333"/><text x="167" y="182" font-size="14" fill="#111">100 calls</text><rect x="45" y="240" width="220" height="60" fill="#333" stroke="#000" stroke-width="2"/><text x="155" y="267" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Origin (database)</text><text x="155" y="287" font-size="14" text-anchor="middle" fill="#fff">100 fetches</text>
<text x="155" y="334" font-size="14" text-anchor="middle" fill="#111">Every request pays the</text><text x="155" y="353" font-size="14" text-anchor="middle" fill="#111">full origin cost.</text>
<rect x="315" y="50" width="270" height="390" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
<text x="450" y="76" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">B. Cache, no single-flight</text>
<rect x="340" y="95" width="220" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="450" y="120" font-size="14" text-anchor="middle" fill="#111">100 client requests</text><line x1="450" y1="135" x2="450" y2="158" stroke="#333" stroke-width="3"/><rect x="340" y="158" width="220" height="40" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/><text x="450" y="183" font-size="13" text-anchor="middle" fill="#111">Cache: entry missing (all 100 miss)</text><line x1="450" y1="198" x2="450" y2="222" stroke="#333" stroke-width="3"/><polygon points="440,220 460,220 450,238" fill="#333"/><text x="464" y="225" font-size="14" fill="#111">100</text><rect x="340" y="240" width="220" height="60" fill="#333" stroke="#000" stroke-width="2"/><text x="450" y="267" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Origin (database)</text><text x="450" y="287" font-size="14" text-anchor="middle" fill="#fff">100 fetches</text>
<text x="450" y="334" font-size="14" text-anchor="middle" fill="#111">Cache helps later requests,</text><text x="450" y="353" font-size="14" text-anchor="middle" fill="#111">but not the burst at expiry.</text><text x="450" y="372" font-size="14" text-anchor="middle" fill="#111">This is the stampede.</text>
<rect x="610" y="50" width="270" height="390" fill="#e8e8e8" stroke="#000" stroke-width="3"/>
<text x="745" y="76" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">C. Cache + single-flight</text>
<rect x="635" y="95" width="220" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="745" y="120" font-size="14" text-anchor="middle" fill="#111">100 client requests</text><line x1="745" y1="135" x2="745" y2="158" stroke="#333" stroke-width="3"/><rect x="620" y="158" width="250" height="46" fill="#fff" stroke="#000" stroke-width="3"/><text x="745" y="178" font-size="14" text-anchor="middle" fill="#111">Cache: 1 leader, 99 waiters</text><text x="745" y="196" font-size="13" text-anchor="middle" fill="#111">(X-Cache-Status MISS / COALESCED)</text><line x1="745" y1="204" x2="745" y2="222" stroke="#333" stroke-width="3"/><polygon points="735,220 755,220 745,238" fill="#333"/><text x="759" y="225" font-size="14" fill="#111">1</text><rect x="635" y="240" width="220" height="60" fill="#333" stroke="#000" stroke-width="2"/><text x="745" y="267" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Origin (database)</text><text x="745" y="287" font-size="14" text-anchor="middle" fill="#fff">1 fetch</text>
<text x="745" y="334" font-size="14" text-anchor="middle" fill="#111">The 99 waiters receive the</text><text x="745" y="353" font-size="14" text-anchor="middle" fill="#111">leader's result.</text><text x="745" y="376" font-size="13" text-anchor="middle" fill="#111">Observed in a test: 1 MISS,</text><text x="745" y="393" font-size="13" text-anchor="middle" fill="#111">99 COALESCED, origin count 1.</text>
<text x="450" y="462" font-size="12.5" text-anchor="middle" fill="#111">A and B are conceptual. C is asserted by a test on loopback (debug build). Counts are illustrative of the mechanism, not a performance measurement.</text>
</svg>
