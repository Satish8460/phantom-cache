<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Comparison with established systems: overlap, difference, maturity</title>
<desc>A table with one row per established system or technique, showing the overlapping mechanism, what PhantomCache does differently, and where the established system is more mature. It is not a ranking and makes no performance claim.</desc>
<rect width="900" height="640" fill="#fff"/>
<text x="450" y="22" text-anchor="middle" font-size="16" font-weight="bold">Overlap, difference and maturity (not a ranking, no performance claim)</text>
<g stroke="#222" stroke-width="1.5">
<rect x="10" y="34" width="150" height="30" fill="#bdbdbd"/><rect x="160" y="34" width="250" height="30" fill="#bdbdbd"/><rect x="410" y="34" width="240" height="30" fill="#bdbdbd"/><rect x="650" y="34" width="240" height="30" fill="#bdbdbd"/>
</g>
<g font-weight="bold"><text x="20" y="54">System</text><text x="170" y="54">Overlapping mechanism</text><text x="420" y="54">PhantomCache differs by</text><text x="660" y="54">Established side is stronger</text></g>
<g stroke="#222" stroke-width="1">
<rect x="10" y="64" width="150" height="70" fill="#f5f5f5"/><rect x="160" y="64" width="250" height="70" fill="#fff"/><rect x="410" y="64" width="240" height="70" fill="#fff"/><rect x="650" y="64" width="240" height="70" fill="#fff"/>
