<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Arial, Helvetica, sans-serif">
  <title>DELETE invalidation fan-out with acknowledgement and repair ledger</title>
  <desc>A DELETE on the issuing gateway purges the local cache, waits for the primary's acknowledgement, answers 204, then fans out asynchronously to all other members through per-peer queues. Failed deliveries are recorded in the repair ledger, which a worker retries every 250 ms. The ledger and queues live in the issuer's memory only.</desc>
  <rect x="0" y="0" width="900" height="722" fill="#ffffff"/>
  <!-- client -->
  <rect x="20" y="20" width="190" height="46" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="115" y="40" font-size="14" text-anchor="middle" fill="#111">Client</text>
  <text x="115" y="57" font-size="14" text-anchor="middle" fill="#111">DELETE /api/v1/cache/k</text>
  <!-- issuer box -->
  <rect x="20" y="90" width="520" height="590" fill="#f4f4f4" stroke="#111" stroke-width="2.5" stroke-dasharray="9 4"/>
  <text x="280" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Issuing gateway G (dashed = process memory; lost if G dies)</text>
  <!-- steps -->
  <circle cx="45" cy="150" r="13" fill="#111"/><text x="45" y="155" font-size="14" text-anchor="middle" fill="#fff">1</text>
  <rect x="68" y="130" width="440" height="40" fill="#cfcfcf" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="147" font-size="14" text-anchor="middle" fill="#111">cache.delete(key): local purge FIRST (generation bump,</text>
  <text x="288" y="163" font-size="14" text-anchor="middle" fill="#111">in-flight fetch detached)</text>
  <circle cx="45" cy="210" r="13" fill="#111"/><text x="45" y="215" font-size="14" text-anchor="middle" fill="#fff">2</text>
  <rect x="68" y="190" width="440" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="207" font-size="14" text-anchor="middle" fill="#111">route_key(key) = primary P (may be G itself).</text>
  <text x="288" y="223" font-size="14" text-anchor="middle" fill="#111">Synchronous InvalidateRequest to P, 150 ms; else 1 acting primary</text>
  <circle cx="45" cy="270" r="13" fill="#111"/><text x="45" y="275" font-size="14" text-anchor="middle" fill="#fff">3</text>
  <rect x="68" y="250" width="440" height="40" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="267" font-size="14" text-anchor="middle" fill="#111">P acks (status success) -> HTTP 204 to the client.</text>
  <text x="288" y="283" font-size="14" text-anchor="middle" fill="#111">On failure: 5xx and EVERY other member recorded as owed (7)</text>
  <circle cx="45" cy="330" r="13" fill="#111"/><text x="45" y="335" font-size="14" text-anchor="middle" fill="#fff">4</text>
  <rect x="68" y="310" width="440" height="52" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="327" font-size="14" text-anchor="middle" fill="#111">fanout_targets: all members except P and G.</text>
  <text x="288" y="343" font-size="14" text-anchor="middle" fill="#111">live peers -> broadcaster queue (1024 tasks); Suspect, Recovering,</text>
  <text x="288" y="359" font-size="14" text-anchor="middle" fill="#111">Failed, Offline peers -> straight to the ledger</text>
  <circle cx="45" cy="410" r="13" fill="#111"/><text x="45" y="415" font-size="14" text-anchor="middle" fill="#fff">5</text>
  <rect x="68" y="386" width="440" height="60" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="404" font-size="14" text-anchor="middle" fill="#111">one worker per peer, queue 256, 16 global send permits.</text>
  <text x="288" y="420" font-size="14" text-anchor="middle" fill="#111">Up to 4 attempts, 150 ms each, backoff 25, 50, 100 ms.</text>
  <text x="288" y="436" font-size="14" text-anchor="middle" fill="#111">Sequence number per destination, reused on retry</text>
  <circle cx="45" cy="490" r="13" fill="#111"/><text x="45" y="495" font-size="14" text-anchor="middle" fill="#fff">6</text>
  <rect x="68" y="466" width="440" height="52" fill="#9a9a9a" stroke="#111" stroke-width="2"/>
  <text x="288" y="484" font-size="14" text-anchor="middle" fill="#000">RepairLedger (per peer: 1024 entries, 256 KiB of keys)</text>
  <text x="288" y="500" font-size="14" text-anchor="middle" fill="#000">overflow: collapse to tenant flush (max 16), then FullCache flush.</text>
  <text x="288" y="514" font-size="14" text-anchor="middle" fill="#000">Duplicates merge. Entry removed only on ack.</text>
  <circle cx="45" cy="560" r="13" fill="#111"/><text x="45" y="565" font-size="14" text-anchor="middle" fill="#fff">7</text>
  <rect x="68" y="538" width="440" height="52" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="556" font-size="14" text-anchor="middle" fill="#111">repair loop every 250 ms: 64 entries per peer per tick,</text>
  <text x="288" y="572" font-size="14" text-anchor="middle" fill="#111">re-send with the SAME sequence. Drained Suspect</text>
  <text x="288" y="586" font-size="14" text-anchor="middle" fill="#111">peer -&gt; Recovering pull loop (digest + replay) -&gt; Active</text>
  <circle cx="45" cy="634" r="13" fill="#111"/><text x="45" y="639" font-size="14" text-anchor="middle" fill="#fff">8</text>
  <rect x="68" y="612" width="440" height="52" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="288" y="630" font-size="14" text-anchor="middle" fill="#111">ring buffer (4096 records, 4 MiB) logs each invalidation sent;</text>
  <text x="288" y="646" font-size="14" text-anchor="middle" fill="#111">peers pull from it after a gap. History overwritten ->  peer</text>
  <text x="288" y="660" font-size="14" text-anchor="middle" fill="#111">flushes its whole cache</text>

  <!-- peers -->
  <rect x="620" y="110" width="260" height="76" fill="#444" stroke="#111" stroke-width="2"/>
  <text x="750" y="132" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Primary P (sync leg)</text>
  <text x="750" y="150" font-size="14" text-anchor="middle" fill="#fff">try_delete_canonical on its cache,</text>
  <text x="750" y="166" font-size="14" text-anchor="middle" fill="#fff">InvalidateAck echoes the epoch</text>
  <rect x="620" y="330" width="260" height="76" fill="#444" stroke="#111" stroke-width="2"/>
  <text x="750" y="352" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Other member Q</text>
  <text x="750" y="370" font-size="14" text-anchor="middle" fill="#fff">applies the delete, records inbound</text>
  <text x="750" y="386" font-size="14" text-anchor="middle" fill="#fff">sequence, acks. No ack = still owed</text>
  <rect x="620" y="500" width="260" height="76" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="750" y="522" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Unreachable member R</text>
  <text x="750" y="540" font-size="14" text-anchor="middle" fill="#111">keeps serving its cached copy until</text>
  <text x="750" y="556" font-size="14" text-anchor="middle" fill="#111">repaired or until the entry expires</text>

  <line x1="508" y1="210" x2="615" y2="160" stroke="#111" stroke-width="2.5"/><polygon points="615,160 603,160 608,171" fill="#111"/>
  <line x1="615" y1="176" x2="508" y2="226" stroke="#111" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="560" y="140" font-size="14" fill="#111">sync</text>
  <line x1="508" y1="416" x2="615" y2="380" stroke="#111" stroke-width="2.5"/><polygon points="615,380 603,380 608,391" fill="#111"/>
  <line x1="508" y1="560" x2="615" y2="540" stroke="#111" stroke-width="2.5" stroke-dasharray="3 5"/>
  <text x="552" y="580" font-size="14" fill="#111">blocked</text>
  <line x1="210" y1="43" x2="288" y2="43" stroke="#111" stroke-width="2"/>
  <line x1="288" y1="43" x2="288" y2="86" stroke="#111" stroke-width="2"/><polygon points="288,90 282,78 294,78" fill="#111"/>
  <text x="550" y="30" font-size="14" fill="#111">solid arrow = request, dashed = ack or blocked path</text>
  <text x="450" y="712" font-size="14" text-anchor="middle" fill="#111">Source: router.rs (invalidate_key_across_cluster, ReplicaBroadcaster, RepairLedger, repair_peer); server.rs::delete_cache_handler</text>
</svg>
