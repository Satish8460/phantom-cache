<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The outcomes of one GET request at a PhantomCache gateway</title>
<desc id="d">A client GET passes authentication when enabled, builds a tenant plus path plus query key, then the gateway checks the local cache. Outcomes: HIT when a fresh entry exists, STALE when an expired entry is served inside the stale window the origin allowed, hard-capped by PHANTOM_MAX_STALE_MS, while background revalidation runs, COALESCED when another request is already fetching the same key, MISS for the single leader that fetches from the origin through the origin gate, and BYPASS for explicit bypass or authorization-header requests.</desc>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="26" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">One GET, five possible X-Cache-Status outcomes (single gateway)</text>

<rect x="8" y="60" width="162" height="50" fill="#ffffff" stroke="#000" stroke-width="2"/>
<text x="89" y="82" font-size="14" text-anchor="middle" fill="#111">Client</text>
<text x="89" y="100" font-size="14" text-anchor="middle" fill="#111">GET /api/v1/cache/{path}</text>

<line x1="170" y1="85" x2="190" y2="85" stroke="#000" stroke-width="2"/>
<polygon points="188,79 200,85 188,91" fill="#000"/>

<rect x="200" y="60" width="150" height="50" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
<text x="275" y="80" font-size="14" text-anchor="middle" fill="#111">1. Auth (if enabled)</text>
<text x="275" y="98" font-size="13" text-anchor="middle" fill="#111">401 / 403 stop here</text>

<line x1="350" y1="85" x2="390" y2="85" stroke="#000" stroke-width="2"/>
<polygon points="388,79 400,85 388,91" fill="#000"/>

<rect x="400" y="60" width="170" height="50" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
<text x="485" y="80" font-size="14" text-anchor="middle" fill="#111">2. Key = tenant + path</text>
<text x="485" y="98" font-size="13" text-anchor="middle" fill="#111">+ query; validate</text>

<line x1="570" y1="85" x2="610" y2="85" stroke="#000" stroke-width="2"/>
<polygon points="608,79 620,85 608,91" fill="#000"/>

<rect x="620" y="60" width="260" height="50" fill="#cfcfcf" stroke="#000" stroke-width="3"/>
<text x="750" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">3. Local cache lookup (one shard)</text>
<text x="750" y="98" font-size="13" text-anchor="middle" fill="#111">no peer is asked on GET</text>

<!-- outcomes -->
<line x1="750" y1="110" x2="750" y2="140" stroke="#000" stroke-width="2"/>
<line x1="100" y1="140" x2="800" y2="140" stroke="#000" stroke-width="2"/>
<line x1="100" y1="140" x2="100" y2="165" stroke="#000" stroke-width="2"/>
<line x1="275" y1="140" x2="275" y2="165" stroke="#000" stroke-width="2"/>
<line x1="450" y1="140" x2="450" y2="165" stroke="#000" stroke-width="2"/>
<line x1="625" y1="140" x2="625" y2="165" stroke="#000" stroke-width="2"/>
<line x1="800" y1="140" x2="800" y2="165" stroke="#000" stroke-width="2"/>

<rect x="20" y="165" width="160" height="120" fill="#ffffff" stroke="#000" stroke-width="3"/>
<text x="100" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">HIT</text>
<text x="100" y="208" font-size="13" text-anchor="middle" fill="#111">fresh entry in cache</text>
<text x="100" y="226" font-size="13" text-anchor="middle" fill="#111">no origin call</text>
<text x="100" y="250" font-size="13" text-anchor="middle" fill="#111">fastest path</text>

<rect x="195" y="165" width="160" height="120" fill="#e8e8e8" stroke="#000" stroke-width="3" stroke-dasharray="8 4"/>
<text x="275" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">STALE</text>
<text x="275" y="204" font-size="13" text-anchor="middle" fill="#111">expired, inside the</text>
<text x="275" y="218" font-size="13" text-anchor="middle" fill="#111">origin's stale window,</text>
<text x="275" y="232" font-size="13" text-anchor="middle" fill="#111">hard-capped by</text>
<text x="275" y="246" font-size="13" text-anchor="middle" fill="#111">PHANTOM_MAX_</text>
<text x="275" y="260" font-size="13" text-anchor="middle" fill="#111">STALE_MS; served</text>
<text x="270" y="274" font-size="13" text-anchor="middle" fill="#111">now, refreshed later</text>

<rect x="370" y="165" width="160" height="120" fill="#bdbdbd" stroke="#000" stroke-width="3"/>
<text x="450" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">COALESCED</text>
<text x="450" y="208" font-size="13" text-anchor="middle" fill="#111">same key already</text>
<text x="450" y="224" font-size="13" text-anchor="middle" fill="#111">being fetched</text>
<text x="450" y="246" font-size="13" text-anchor="middle" fill="#111">wait, share the</text>
<text x="450" y="262" font-size="13" text-anchor="middle" fill="#111">leader's result</text>

<rect x="545" y="165" width="160" height="120" fill="#333333" stroke="#000" stroke-width="3"/>
<text x="625" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">MISS</text>
<text x="625" y="208" font-size="13" text-anchor="middle" fill="#ffffff">first request for the</text>
<text x="625" y="224" font-size="13" text-anchor="middle" fill="#ffffff">key: the LEADER</text>
<text x="625" y="246" font-size="13" text-anchor="middle" fill="#ffffff">fetches from origin,</text>
<text x="625" y="262" font-size="13" text-anchor="middle" fill="#ffffff">then stores</text>

<rect x="720" y="165" width="160" height="120" fill="#ffffff" stroke="#000" stroke-width="3" stroke-dasharray="2 4"/>
<text x="800" y="188" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">BYPASS</text>
<text x="800" y="208" font-size="13" text-anchor="middle" fill="#111">x-cache-bypass: true</text>
<text x="800" y="224" font-size="13" text-anchor="middle" fill="#111">(BYPASS-AUTH when a</text>
<text x="800" y="240" font-size="13" text-anchor="middle" fill="#111">client sends credentials)</text>
<text x="800" y="262" font-size="13" text-anchor="middle" fill="#111">never read or stored</text>

<!-- leader detail -->
<line x1="625" y1="285" x2="625" y2="315" stroke="#000" stroke-width="2"/>
<polygon points="619,313 625,325 631,313" fill="#000"/>
<rect x="425" y="325" width="400" height="56" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
<text x="625" y="346" font-size="14" text-anchor="middle" fill="#111">4. Origin gate (concurrency cap; enforced only in</text>
<text x="625" y="364" font-size="14" text-anchor="middle" fill="#111">canary/active intelligence mode) then HTTP fetch</text>
<line x1="625" y1="381" x2="625" y2="400" stroke="#000" stroke-width="2"/>
<polygon points="619,398 625,410 631,398" fill="#000"/>
<rect x="425" y="410" width="400" height="44" fill="#ffffff" stroke="#000" stroke-width="2"/>
<text x="625" y="430" font-size="14" text-anchor="middle" fill="#111">5. Store only if the entry was not invalidated meanwhile</text>
<text x="625" y="446" font-size="13" text-anchor="middle" fill="#111">(generation and epoch fencing); wake waiters</text>

<text x="20" y="352" font-size="13" fill="#111">Chapter 2 walks this path in detail.</text>
<text x="20" y="370" font-size="13" fill="#111">Chapter 4 explains the sharding,</text>
<text x="20" y="388" font-size="13" fill="#111">coalescing and fencing.</text>
</svg>
