<rect x="610" y="290" width="280" height="58" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="2 4"/><text x="620" y="314" font-size="13" font-weight="bold" fill="#111">Tenant quotas, fair eviction</text><text x="620" y="334" font-size="13" fill="#111">DESIGNED BUT NOT IMPLEMENTED</text>
<rect x="610" y="356" width="280" height="58" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="2 4"/><text x="620" y="380" font-size="13" font-weight="bold" fill="#111">Demo Center, demo-1 event stream</text><text x="620" y="400" font-size="13" fill="#111">DESIGNED BUT NOT IMPLEMENTED</text>
