<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Arial, Helvetica, sans-serif">
<title>Status map of the three pillars</title>
<desc>Three columns, one per pillar. Each box names a capability and gives its single status label. Heavy solid border means tested, dashed means partial or prototype only, dotted means designed but not implemented, double line means blocked. Nothing is independently verified by a human.</desc>
<rect width="900" height="624" fill="#ffffff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Status map of the three pillars (2026-10-30)</text>
<text x="450" y="48" text-anchor="middle" font-size="13" fill="#333">The best label in any box is TESTED. No box is INDEPENDENTLY VERIFIED by a human.</text>
<rect x="10" y="58" width="280" height="26" fill="#222"/><text x="150" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Pillar 1: Distributed systems</text>
<rect x="10" y="92" width="280" height="58" fill="#d9d9d9" stroke="#111" stroke-width="3"/><text x="20" y="116" font-size="13" font-weight="bold" fill="#111">Single-node fenced engine</text><text x="20" y="136" font-size="13" fill="#111">TESTED (debug, loopback)</text>
<rect x="10" y="158" width="280" height="58" fill="#d9d9d9" stroke="#111" stroke-width="3"/><text x="20" y="182" font-size="13" font-weight="bold" fill="#111">Invalidation bus, repair, anti-entropy</text><text x="20" y="202" font-size="13" fill="#111">TESTED (loopback only)</text>
<rect x="10" y="224" width="280" height="58" fill="#f0f0f0" stroke="#111" stroke-width="2" stroke-dasharray="8 4"/><text x="20" y="248" font-size="13" font-weight="bold" fill="#111">Durable invalidation (M3)</text><text x="20" y="268" font-size="13" fill="#111">PROTOTYPE ONLY (sandbox)</text>
<rect x="10" y="290" width="280" height="58" fill="#f0f0f0" stroke="#111" stroke-width="2" stroke-dasharray="8 4"/><text x="20" y="314" font-size="13" font-weight="bold" fill="#111">Heartbeat state, runtime membership</text><text x="20" y="334" font-size="13" fill="#111">PARTIAL (static members)</text>
<rect x="10" y="356" width="280" height="58" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="2 4"/><text x="20" y="380" font-size="13" font-weight="bold" fill="#111">Coordinated reads, peer-fill, placement</text><text x="20" y="400" font-size="13" fill="#111">DESIGNED BUT NOT IMPLEMENTED</text>
<rect x="10" y="422" width="280" height="58" fill="#bdbdbd" stroke="#111" stroke-width="2"/><rect x="14" y="426" width="272" height="50" fill="none" stroke="#111" stroke-width="1"/><text x="20" y="446" font-size="13" font-weight="bold" fill="#111">Multi-host and WAN evidence</text><text x="20" y="466" font-size="13" fill="#111">BLOCKED (devices needed)</text>
<rect x="310" y="58" width="280" height="26" fill="#222"/><text x="450" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Pillar 2: Workload intelligence</text>
<rect x="310" y="92" width="280" height="58" fill="#d9d9d9" stroke="#111" stroke-width="3"/><text x="320" y="116" font-size="13" font-weight="bold" fill="#111">Static origin cap, mode parsing</text><text x="320" y="136" font-size="13" fill="#111">TESTED (unit and Scenario B)</text>
<rect x="310" y="158" width="280" height="58" fill="#f0f0f0" stroke="#111" stroke-width="2" stroke-dasharray="8 4"/><text x="320" y="182" font-size="13" font-weight="bold" fill="#111">AIMD cap controller</text><text x="320" y="202" font-size="13" fill="#111">IMPLEMENTED; benefit NOT SUPPORTED</text>
