<rect x="610" y="92" width="280" height="58" fill="#d9d9d9" stroke="#111" stroke-width="3"/><text x="620" y="116" font-size="13" font-weight="bold" fill="#111">Lab API and Scenario B (exploratory)</text><text x="620" y="136" font-size="13" fill="#111">TESTED (U-01 defect open)</text>
