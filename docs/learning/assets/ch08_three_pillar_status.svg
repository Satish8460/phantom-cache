<rect x="310" y="356" width="280" height="58" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="2 4"/><text x="320" y="380" font-size="13" font-weight="bold" fill="#111">Event tap E0, hot-key detector</text><text x="320" y="400" font-size="13" fill="#111">DESIGNED BUT NOT IMPLEMENTED</text>
