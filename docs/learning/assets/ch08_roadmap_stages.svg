<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Arial, Helvetica, sans-serif">
<title>Roadmap in dependency order</title>
<desc>Four stages left to right: review and decide, close known defects, measure honestly, gated features. Arrows show each stage depends on the previous one. There are no calendar dates because the repository records none.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect width="900" height="440" fill="#fff"/>
<text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Roadmap in dependency order (no calendar dates recorded)</text>
<text x="450" y="48" text-anchor="middle" font-size="13" fill="#333">Order is by dependency, not by schedule. Every box is a plan, not a commitment.</text>
<rect x="10" y="70" width="200" height="250" fill="#d9d9d9" stroke="#111" stroke-width="2"/><text x="20" y="94" font-size="15" font-weight="bold" fill="#111">1. Now</text><text x="20" y="114" font-size="13" fill="#111">Review and decide</text><text x="20" y="144" font-size="13" fill="#111">&#8226; Human and external review</text><text x="32" y="160" font-size="13" fill="#111">of the G4 blockers</text><text x="20" y="202" font-size="13" fill="#111">&#8226; Owner decisions: M3</text><text x="32" y="218" font-size="13" fill="#111">policy, DR-027, G4B-01</text><text x="20" y="260" font-size="13" fill="#111">&#8226; Commit only reviewed</text><text x="32" y="276" font-size="13" fill="#111">groups (docs done, code</text><text x="32" y="292" font-size="13" fill="#111">held)</text><line x1="212" y1="195" x2="238" y2="195" stroke="#111" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240" y="70" width="200" height="250" fill="#e8e8e8" stroke="#111" stroke-width="2"/><text x="250" y="94" font-size="15" font-weight="bold" fill="#111">2. Next</text><text x="250" y="114" font-size="13" fill="#111">Close known defects</text><text x="250" y="144" font-size="13" fill="#111">&#8226; Integrate M3 durable log</text><text x="262" y="160" font-size="13" fill="#111">and drain, after review</text><text x="250" y="202" font-size="13" fill="#111">&#8226; G4A-01 fence fix and U-01</text><text x="262" y="218" font-size="13" fill="#111">backend fix, after review</text><text x="250" y="260" font-size="13" fill="#111">&#8226; SEC-M7-09/10/11, advisory</text><text x="262" y="276" font-size="13" fill="#111">scan, rate limits</text><line x1="442" y1="195" x2="468" y2="195" stroke="#111" stroke-width="2.5" marker-end="url(#ar)"/><rect x="470" y="70" width="200" height="250" fill="#f3f3f3" stroke="#111" stroke-width="2"/><text x="480" y="94" font-size="15" font-weight="bold" fill="#111">3. Then</text><text x="480" y="114" font-size="13" fill="#111">Measure honestly</text><text x="480" y="144" font-size="13" fill="#111">&#8226; Release-profile suite, 2</text><text x="492" y="160" font-size="13" fill="#111">h soak, cargo fmt</text><text x="480" y="202" font-size="13" fill="#111">&#8226; Event tap E0 overhead;</text><text x="492" y="218" font-size="13" fill="#111">tenant accounting (I9)</text><text x="480" y="260" font-size="13" fill="#111">&#8226; Multi-host LAN run (needs</text><text x="492" y="276" font-size="13" fill="#111">physical devices)</text><line x1="672" y1="195" x2="698" y2="195" stroke="#111" stroke-width="2.5" marker-end="url(#ar)"/><rect x="700" y="70" width="200" height="250" fill="#ffffff" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/><text x="710" y="94" font-size="15" font-weight="bold" fill="#111">4. Later</text><text x="710" y="114" font-size="13" fill="#111">Gated features</text><text x="710" y="144" font-size="13" fill="#111">&#8226; Quotas and fair eviction</text><text x="722" y="160" font-size="13" fill="#111">(frozen core: addendum 2)</text><text x="710" y="202" font-size="13" fill="#111">&#8226; Intelligence E1/E2</text><text x="722" y="218" font-size="13" fill="#111">headroom (owner salt)</text><text x="710" y="260" font-size="13" fill="#111">&#8226; Peer-fill, placement</text><text x="722" y="276" font-size="13" fill="#111">(Level C), warm-up (E9)</text><rect x="10" y="345" width="880" height="48" fill="#fff" stroke="#111" stroke-width="1.5"/>
<text x="20" y="366" font-size="13" fill="#111">Gates in force at every stage: independent review (CLAUDE.md section 5), owner approval for the protected core, a test that fails</text>
<text x="20" y="384" font-size="13" fill="#111">without the change, and a release-profile measurement before any performance claim.</text>
<text x="10" y="420" font-size="13" fill="#333">Source: release/execution_register.md; release/lead_working_state.md section 4; vision/phantomcache_three_pillar_product_direction.md section 12.</text>
</svg>