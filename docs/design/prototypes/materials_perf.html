<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhantomCache materials performance prototype</title>
<!-- h    ANTI-PATTERN stress: d plus backdrop blur on every data panel (90 surfaces); shows where the cost breaks
     Standalone, no dependencies. NOT part of ui/src. Variant is chosen with ?v=a|b|c|d|d32|e|f|g
     a    solid (no blur)
     b    backdrop-filter blur 12px on 2 surfaces (header, floating action bar)
     c    blur 12px on 6 surfaces (header, rail, toolbar, action bar, 2 floating status surfaces)
     d    large: full-height rail + full-width header + full-width toolbar, blur 12px
     d32  as d with blur 32px (radius sensitivity)
     e    d + continuous opacity/transform animation of panels that sit under the glass (worst case for backdrop re-sampling)
     f    3D tilt cards: 6 cards under perspective, class toggled every 250 ms to emulate hover transitions
     g    modal open: blurred scrim + glass dialog
     Measured by docs/design/prototypes/perf/run_perf.mjs. -->
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#f4f5f7,#0e1116);--surface:light-dark(#fff,#161a21);--surface-2:light-dark(#eceff3,#1d222b);
 --border:light-dark(#d5d9e0,#2c3340);--text:light-dark(#14181f,#e8ebf0);--text-2:light-dark(#3f4756,#b9c1ce);
 --accent:light-dark(#0b5fd1,#6aa8ff);
 --glass-bg:light-dark(rgb(255 255 255/.80),rgb(22 26 33/.78));
 --glass-edge:light-dark(rgb(255 255 255/.7),rgb(255 255 255/.10));
 --blur:12px;--sat:1.4;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif;
 background-image:radial-gradient(900px 500px at 15% 0%,light-dark(#dbe7fb,#14284a),transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 31px,light-dark(#e3e6ec,#1a2029) 31px 32px);}
.hdr{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;
 background:var(--surface);border-bottom:1px solid var(--border)}
.rail{position:fixed;left:0;top:56px;bottom:0;width:216px;z-index:20;background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow:hidden}
.rail a{display:block;padding:6px 8px;color:var(--text-2);font-size:13px}
.tool{position:sticky;top:56px;z-index:25;height:44px;display:flex;align-items:center;padding:0 16px;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;margin-left:216px}
.main{margin-left:216px;padding:16px 24px 120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:13px;line-height:1.4;box-shadow:0 1px 2px rgb(16 24 40/.06)}
.panel h3{margin:0 0 6px;font-size:15px}.panel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.panel td,.panel th{border-bottom:1px solid var(--border);padding:3px 4px;text-align:left}
.panel code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.bar{position:fixed;left:240px;right:24px;bottom:16px;z-index:40;height:56px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 12px rgb(16 24 40/.14)}
.fl{position:fixed;z-index:35;right:24px;width:220px;height:64px;border-radius:12px;padding:10px;font-size:12px;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 12px rgb(16 24 40/.14)}
.fl1{top:120px}.fl2{top:200px}.fl3{top:280px}
.scrim{position:fixed;inset:0;z-index:60;background:rgb(0 0 0/.4);display:none}
.dlg{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(32rem,92vw);padding:24px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:none;box-shadow:0 12px 32px rgb(16 24 40/.22)}
.v-b .hdr,.v-b .bar,
.v-c .hdr,.v-c .bar,.v-c .rail,.v-c .tool,.v-c .fl1,.v-c .fl2,
.v-d .hdr,.v-d .rail,.v-d .tool,.v-d32 .hdr,.v-d32 .rail,.v-d32 .tool,
.v-e .hdr,.v-e .rail,.v-e .tool,.v-e .bar{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
.v-d32{--blur:32px}
.v-h .hdr,.v-h .rail,.v-h .tool,.v-h .bar,.v-h .panel{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
.v-e .p-anim{animation:drift 1.2s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes drift{from{transform:translateY(0);opacity:1}to{transform:translateY(-14px);opacity:.6}}
.v-f .grid{perspective:900px}
.v-f .panel.t{transform-style:preserve-3d;transition:transform 200ms cubic-bezier(.2,.8,.2,1),box-shadow 200ms}
.v-f .panel.t.on{transform:rotateX(4deg) rotateY(-6deg) translateZ(8px);box-shadow:0 12px 32px rgb(16 24 40/.22)}
.v-g .scrim{display:block;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.v-g .dlg{display:block;background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
@media (max-width:819px){.rail{display:none}.main{margin-left:0;padding:12px 16px 120px}.tool{margin-left:0}.grid{grid-template-columns:1fr}.bar{left:16px;right:16px}.fl{width:140px;right:8px;height:48px}.fl1{top:116px}.fl2{top:172px}.fl3{display:none}}
@media (prefers-reduced-transparency:reduce){.hdr,.rail,.tool,.bar,.dlg{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--surface)!important}}
@media (forced-colors:active){.hdr,.rail,.tool,.bar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:Canvas!important;border:1px solid CanvasText}}
</style>
</head>
<body>
<header class="hdr"><strong>PhantomCache</strong><span>Control Center</span><span style="margin-left:auto">Live</span></header>
<nav class="rail" aria-label="demo"><a href="#">Overview</a><a href="#">Traffic and latency</a><a href="#">Cache and memory</a><a href="#">Freshness</a><a href="#">Origin</a><a href="#">Phantom Lab</a><a href="#">Simulation</a></nav>
<div class="tool">Phantom Lab / Evidence <span style="margin-left:auto">Retained</span></div>
<div class="fl fl1">Status: connected</div><div class="fl fl2">Run 2 of 10</div><div class="fl fl3">Note</div>
<main class="main"><div class="grid" id="grid"></div></main>
<div class="bar"><button>Start a run</button><span>Debug build: results EXPLORATORY</span></div>
<div class="scrim"></div><div class="dlg"><h3>Cancel this run?</h3><p>It stops, and any result so far is partial.</p></div>
<script>
const q=new URLSearchParams(location.search);const v=q.get('v')||'a';document.body.className='v-'+v;
const g=document.getElementById('grid');let h='';
for(let i=0;i<90;i++){h+='<section class="panel'+(i<6&&v==='f'?' t':'')+(i%7===3?' p-anim':'')+'"><h3>Experiment panel '+(i+1)+'</h3><p>Peak origin concurrency fell from about 39 to 24 under the static cap. Latency percentiles over all requests include fast-fail 503s and are not evidence of improved latency for served clients.</p><table><tr><th>Arm</th><th>Peak</th><th>Success</th></tr><tr><td>BASE</td><td>39</td><td>100.0%</td></tr><tr><td>STATIC-CAP</td><td>24</td><td>95.1%</td></tr><tr><td>AIMD-CAP</td><td>14</td><td>82.9%</td></tr></table><p><code>scenario_b.20261030T003932Z</code></p></section>'}
g.innerHTML=h;
window.__tilt=function(){var c=[].slice.call(document.querySelectorAll('.panel.t'));var on=false;return setInterval(function(){on=!on;c.forEach(function(x){x.classList.toggle('on',on)})},250)};
window.__scroll=function(ms,pxps){return new Promise(function(res){var d=[];var last=performance.now(),t0=last,y0=scrollY;
 if(v==='f')window.__tilt();
 function f(t){d.push(t-last);last=t;var el=t-t0;scrollTo(0,Math.min(y0+el/1000*pxps,document.body.scrollHeight));if(el<ms)requestAnimationFrame(f);else res({d:d,h:document.body.scrollHeight,y:scrollY})}
 requestAnimationFrame(f)})};
</script>
</body></html>
