# PhantomCache example configuration (development / local evaluation).
# Usage:  phantom-cache-demo --config phantom.example.conf --check-config
# Format: KEY=VALUE, '#' full-line comments. Reference: docs/user/configuration.md
# Precedence: command line > environment > this file > defaults.

# Loopback bind: no authentication or TLS required.
PHANTOM_BIND_ADDR=127.0.0.1:8085

# Origin the gateway fetches from on a cache miss (uncomment and set).
# ORIGIN_URL=http://127.0.0.1:9000

# Cache memory budget (bytes). Default 256 MiB.
PHANTOM_MAX_CACHE_BYTES=268435456

# Hard staleness cap (ms). Default 24 hours.
PHANTOM_MAX_STALE_MS=86400000

# Intelligence stays off unless you have a reason; canary/active are experimental
# and a benefit from adaptive control has not been established.
PHANTOM_INTELLIGENCE=off

# SYNTHETIC dashboard values. Leave false for anything you want to trust.
PHANTOM_SIMULATION=false
