# PhantomCache example configuration for a network-facing deployment.
# Validate first:  phantom-cache-demo --config phantom.production.example.conf --check-config
# This file contains NO real secrets. Provide the JWT secret through the environment
# (PHANTOM_JWT_SECRET) or a file readable only by the service account. Do not commit secrets.

PHANTOM_MODE=production
PHANTOM_BIND_ADDR=0.0.0.0:8443
PHANTOM_TLS_CERT=/etc/phantom/tls/server.pem
PHANTOM_TLS_KEY=/etc/phantom/tls/server.key
PHANTOM_REQUIRE_AUTH=true
# PHANTOM_JWT_SECRET=<at least 32 bytes, from your secret store>
PHANTOM_JWT_ISSUER=phantom-cache-auth
PHANTOM_JWT_AUDIENCE=phantom-cache-api

ORIGIN_URL=https://origin.internal.example:443
PHANTOM_ORIGIN_ALLOWLIST=https://origin.internal.example:443
PHANTOM_ENFORCE_UPSTREAM_TLS=true

PHANTOM_MAX_CACHE_BYTES=268435456
PHANTOM_MAX_STALE_MS=86400000
PHANTOM_SIMULATION=false
PHANTOM_INTELLIGENCE=off
